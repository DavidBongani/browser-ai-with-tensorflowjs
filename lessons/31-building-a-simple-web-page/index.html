<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lesson 31 — Building a Simple Web Page</title>
</head>
<body>
  <main>
    <h1>Browser Transfer Learning Lab</h1>
    <p id="status" role="status">Ready to collect examples.</p>

    <section aria-labelledby="camera-heading">
      <h2 id="camera-heading">Camera</h2>
      <video
        id="webcam"
        width="224"
        height="224"
        autoplay
        muted
        playsinline
      ></video>
      <button id="start-camera" type="button">
        Start camera
      </button>
    </section>

    <section aria-labelledby="examples-heading">
      <h2 id="examples-heading">Training examples</h2>
      <div id="capture-controls">
        <button type="button" data-class-id="0">
          Capture class 1
        </button>
        <button type="button" data-class-id="1">
          Capture class 2
        </button>
        <button type="button" data-class-id="2">
          Capture class 3
        </button>
      </div>
      <output id="counts">0 / 0 / 0</output>
    </section>

    <section aria-labelledby="model-heading">
      <h2 id="model-heading">Classifier</h2>
      <button id="train" type="button" disabled>
        Train classifier
      </button>
      <button id="predict" type="button" disabled>
        Predict
      </button>
      <output id="prediction">No prediction yet.</output>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
