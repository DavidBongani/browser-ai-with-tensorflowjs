<body>
  <main>
    <h1>Rock Paper Scissors In Code</h1>

    <button id="train" type="button">Train classifier</button>

    <div id="moves">

      <button type="button" data-move="paper">Paper</button>
      <button type="button" data-move="scissors">Scissors</button>
    </div>

    <p id="status">Train the classifier first.</p>
    <pre id="result"></pre>
  </main>
